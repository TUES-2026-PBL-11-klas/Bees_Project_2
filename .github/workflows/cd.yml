name: CD Pipeline

on:
  push:
    branches:
      - main
    paths-ignore:
      - deploy/kubernetes/deployment.yaml

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      pull-requests: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lowercase owner and repository
        run: |
          echo "OWNER=$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
          echo "REPOSITORY=$(echo ${{ github.event.repository.name }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ env.OWNER }}/${{ env.REPOSITORY }}:${{ github.sha }}

      - name: Update Kubernetes Deployment with new image tag
        run: |
          sed -i "s|^\(\s*image:\s*\).*|\1ghcr.io/${{ env.OWNER }}/${{ env.REPOSITORY }}:${{ github.sha }}|g" deploy/kubernetes/deployment.yaml

      - name: Create Pull Request for deployment image update
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "chore: update image tag to ${{ github.sha }} [skip ci]"
          title: "chore: update image tag to ${{ github.sha }}"
          body: |
            Automated update of Kubernetes deployment image tag.

            - Image: `ghcr.io/${{ env.OWNER }}/${{ env.REPOSITORY }}:${{ github.sha }}`
            - Source commit: `${{ github.sha }}`
          branch: "ci/update-image-${{ github.sha }}"
          delete-branch: true
          add-paths: |
            deploy/kubernetes/deployment.yaml
