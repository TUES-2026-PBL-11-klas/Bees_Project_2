global:
  resolve_timeout: 5m
  smtp_smarthost: "smtp.gmail.com:587"
  smtp_from: "${ALERT_EMAIL}"
  smtp_auth_username: "${ALERT_EMAIL}"
  smtp_auth_password: "${SMTP_PASSWORD}"
  smtp_require_tls: true

route:
  receiver: "email-notifications"
  group_wait: 10s
  group_interval: 5m
  repeat_interval: 1h

receivers:
  - name: "email-notifications"
    email_configs:
      - to: "${ALERT_EMAIL}"
        send_resolved: true
