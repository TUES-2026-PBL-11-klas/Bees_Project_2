apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: aws-secretsmanager
spec:
  provider:
    aws:
      service: SecretsManager
      region: YOUR_AWS_REGION
      auth:
        jwt:
          serviceAccountRef:
            # Placeholder: bind this ServiceAccount to an IAM role (IRSA)
            # with permission to read clearwake/mongodb-uri.
            name: external-secrets-sa
