<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      font-family: sans-serif;
    }
    #map {
      width: 100%;
      height: 100vh;
    }
    .map-banner {
      position: fixed;
      top: 12px;
      left: 12px;
      z-index: 9999;
      background: rgba(255, 255, 255, 0.9);
      border-radius: 8px;
      padding: 8px 12px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.15);
      font-size: 13px;
    }
  </style>
</head>
<body>
<div class="map-banner" id="mapBanner">Map provider: loading...</div>
<div id="map"></div>
<script>
  const MAP_PROVIDER = "__MAP_PROVIDER__";
  const mapBanner = document.getElementById('mapBanner');
  const center = { lat: 20, lng: 50 };
  const routeId = new URLSearchParams(window.location.search).get('routeId');

  let leafletMap = null;
  const baseLayers = {};

  async function loadZones() {
    const response = await fetch('/api/v1/zones/');
    if (!response.ok) {
      return [];
    }
    return response.json();
  }

  async function loadRoute() {
    if (!routeId) {
      return null;
    }
    const response = await fetch(`/api/v1/routes/${routeId}`);
    if (!response.ok) {
      return null;
    }
    return response.json();
  }

  async function renderLeaflet() {
    const selectedStyle = (MAP_PROVIDER || 'carto-voyager').toLowerCase();
    mapBanner.textContent = selectedStyle === 'carto-positron'
      ? 'Map provider: CARTO Positron (free)'
      : 'Map provider: CARTO Voyager (free)';

    leafletMap = L.map('map').setView([center.lat, center.lng], 3);

    const voyagerLayer = L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
      subdomains: 'abcd',
      maxZoom: 20,
      attribution: '&copy; OpenStreetMap contributors &copy; CARTO'
    });

    const positronLayer = L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
      subdomains: 'abcd',
      maxZoom: 20,
      attribution: '&copy; OpenStreetMap contributors &copy; CARTO'
    });

    baseLayers['CARTO Voyager'] = voyagerLayer;
    baseLayers['CARTO Positron'] = positronLayer;

    const activeLayer = selectedStyle === 'carto-positron' ? positronLayer : voyagerLayer;
    activeLayer.addTo(leafletMap);

    L.control.layers(baseLayers, null, { collapsed: false, position: 'topright' }).addTo(leafletMap);

    const zones = await loadZones();
    zones.forEach((zone) => {
      L.geoJSON(zone.geometry, {
        style: { color: '#e11d48', fillColor: '#fb7185', fillOpacity: 0.28, weight: 2 }
      }).bindPopup(zone.name || 'Zone').addTo(leafletMap);
    });

    const route = await loadRoute();
    if (route && route.waypoints) {
      const coords = route.waypoints.map((w) => [w.coordinates[1], w.coordinates[0]]);
      L.polyline(coords, { color: '#0f4c81', weight: 4, opacity: 0.95 }).addTo(leafletMap);
    }
  }

  async function init() {
    await renderLeaflet();
  }

  init();
</script>
</body>
</html>
