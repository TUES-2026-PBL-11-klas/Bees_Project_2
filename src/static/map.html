<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style> #map { height: 100vh; } </style>
</head>
<body>
<div id="map"></div>
<script>
  const map = L.map('map').setView([20, 50], 3);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap'
  }).addTo(map);

  fetch('/api/v1/zones')
    .then(r => r.json())
    .then(zones => {
      zones.forEach(zone => {
        L.geoJSON(zone.geometry, {
          style: { color: 'red', fillOpacity: 0.3 }
        }).bindPopup(zone.name).addTo(map);
      });
    });

  fetch('/api/v1/routes/69c2c05654bc7d531fd5bd95')
    .then(r => r.json())
    .then(route => {
      const coords = route.waypoints.map(w => [w.coordinates[1], w.coordinates[0]]);
      L.polyline(coords, { color: 'blue', weight: 3 }).addTo(map);
    });
</script>
</body>
</html>
